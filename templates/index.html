<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vehicle Insurance Cross-Sell Prediction</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem 1rem; }
  label { display: flex; flex-direction: column; font-size: .85rem; gap: .25rem; }
  input, select { padding: .45rem; font-size: 1rem; border: 1px solid #bbb; border-radius: 4px; }
  button { grid-column: span 2; padding: .7rem; font-size: 1rem; background: #1f5f8b; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
  #result { margin-top: 1.5rem; padding: 1rem; border-radius: 6px; display: none; }
  .yes { background: #e3f4e8; } .no { background: #f4efe3; } .err { background: #f8e1e1; }
</style>
</head>
<body>
<h1>Vehicle Insurance Cross-Sell Prediction</h1>
<p>Enter a policyholder's details to get the probability that they take up vehicle insurance.</p>
<form id="f">
  <label>Gender<select name="gender"><option>Male</option><option>Female</option></select></label>
  <label>Date of birth<input type="date" name="customer_date_of_birth" value="1977-03-07" required></label>
  <label>Driving licence<select name="driving_license"><option value="1">Yes</option><option value="0">No</option></select></label>
  <label>Sub-county<input name="customer_residence_sub_county" value="EMBAKASI" required></label>
  <label>Previously insured<select name="previously_insured"><option value="0">No</option><option value="1">Yes</option></select></label>
  <label>Vehicle year of manufacture<input type="number" name="vehicle_year_of_manufacture" value="2020" required></label>
  <label>Vehicle damage<select name="vehicle_damage"><option>Yes</option><option>No</option></select></label>
  <label>Annual premium (KES)<input type="number" name="annual_premium" value="38294" required></label>
  <label>Agent name<input name="agent_name" value="Jomo Kenyatta" required></label>
  <label>Life policy start date<input type="date" name="life_policy_start_date" value="2023-12-21" required></label>
  <button type="submit">Predict</button>
</form>
<div id="result"></div>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  for (const k of ["driving_license", "previously_insured", "vehicle_year_of_manufacture"]) data[k] = parseInt(data[k]);
  data.annual_premium = parseFloat(data.annual_premium);
  const box = document.getElementById("result");
  box.style.display = "block";
  try {
    const r = await fetch("/predict", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
    const out = await r.json();
    if (!r.ok) throw new Error(JSON.stringify(out.detail));
    box.className = out.contact ? "yes" : "no";
    box.innerHTML = `<strong>Probability of responding: ${(out.probability * 100).toFixed(1)}%</strong><br>` +
      (out.contact ? "Recommend contacting this customer." : "Below the contact threshold.") +
      ` (threshold ${(out.threshold * 100).toFixed(0)}%)`;
  } catch (err) {
    box.className = "err";
    box.textContent = "Error: " + err.message;
  }
});
</script>
</body>
</html>
